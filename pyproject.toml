[project]
name = "neuro2"
version = "0.1.0"
description = "Адаптивный хост на принципах неокортекса: канонические колоночные микроконтуры, свободная энергия, активное выведение"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0.0",
    "numpy>=2.4.6",
    "openai>=3.1.0",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.2",
    "scipy>=1.17.1",
    "sqlite-vec>=0.1.9",
    "torch>=2.13.0",
]

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "pyright>=1.1.414",
    "ruff==0.17.0",
]
